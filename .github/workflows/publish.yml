name: Publish to MCP Registry
on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MCP Publisher
        run: |
          export OS=$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}.tar.gz" | tar xz mcp-publisher

      - name: Authenticate with GitHub
        run: |
          ./mcp-publisher login github --provider github

      - name: Publish Server
        run: |
          ./mcp-publisher publish \
            --name "io.github.wacommercehub-rgb/whatsapp-shop-manager-mcp" \
            --description "Connects and syncs e-commerce stores directly to WhatsApp Shop Manager to automate product catalogs and messaging." \
            --repo "https://github.com/wacommercehub-rgb/whatsapp-shop-manager"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
